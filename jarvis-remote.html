<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JARVIS Remoto</title>
<style>
  :root{
    --bg:#050b10; --cyan:#4fd8ff; --cyan-dim:#1f4a5c; --cyan-glow:rgba(79,216,255,0.35);
    --red:#ff5f56; --text:#cdeefc; --text-dim:#5f8a99;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; background: radial-gradient(ellipse at 50% -10%, #0d1e28 0%, var(--bg) 55%);
    font-family:'Courier New', Consolas, monospace; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  #app{ width:100%; max-width:460px; height:100vh; display:flex; flex-direction:column; padding:20px; padding-top:max(20px, env(safe-area-inset-top)); padding-bottom:max(20px, env(safe-area-inset-bottom)); }
  h1{ text-align:center; font-size:22px; letter-spacing:6px; color:var(--cyan); text-shadow:0 0 10px var(--cyan-glow); margin:0 0 4px; }
  .sub{ text-align:center; font-size:10px; letter-spacing:2px; color:var(--text-dim); margin-bottom:20px; }

  .orb-wrap{ position:relative; width:180px; height:180px; margin:10px auto 20px; display:flex; align-items:center; justify-content:center; }
  .orb-ring{ position:absolute; border-radius:50%; border:1px solid var(--cyan-dim); opacity:0.5; }
  .ring1{ width:180px; height:180px; } .ring2{ width:140px; height:140px; }
  body.listening .orb-ring, body.speaking .orb-ring{ border-color:var(--cyan); animation:ringPulse 1.6s ease-out infinite; }
  .ring2{ animation-delay:0.3s !important; }
  @keyframes ringPulse{ 0%{transform:scale(0.85); opacity:0.9;} 100%{transform:scale(1.15); opacity:0;} }
  .orb{ width:110px; height:110px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #d7f6ff, var(--cyan) 42%, #0a3a4a 78%, #04141a 100%); box-shadow:0 0 30px var(--cyan-glow), inset 0 0 16px rgba(255,255,255,0.35); transition:all .3s ease; }
  body.listening .orb{ box-shadow:0 0 55px rgba(79,216,255,0.65); transform:scale(1.04); }
  body.speaking .orb{ animation:speakPulse .5s ease-in-out infinite alternate; }
  @keyframes speakPulse{ from{transform:scale(1.02);} to{transform:scale(1.08);} }

  #stateLabel{ text-align:center; font-size:12px; letter-spacing:3px; color:var(--text-dim); margin-bottom:20px; text-transform:uppercase; }
  body.listening #stateLabel{ color:var(--cyan); }

  #talkBtn{
    width:84px; height:84px; border-radius:50%; border:2px solid var(--cyan); background:rgba(79,216,255,0.08);
    color:var(--cyan); font-size:30px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;
  }
  #talkBtn.active{ background:rgba(255,95,86,0.15); border-color:var(--red); color:var(--red); }

  .caption{ flex:1; overflow-y:auto; text-align:center; padding:0 10px; }
  .caption-user{ font-size:12px; color:#e08a5b; margin-bottom:8px; }
  .caption-jarvis{ font-size:15px; line-height:1.6; white-space:pre-wrap; }

  .textbar{ display:flex; gap:8px; margin-top:16px; }
  #textInput{ flex:1; background:rgba(255,255,255,0.03); border:1px solid var(--cyan-dim); color:var(--text); padding:12px; border-radius:6px; font-family:inherit; font-size:14px; }
  #sendBtn{ background:rgba(79,216,255,0.1); border:1px solid var(--cyan); color:var(--cyan); padding:0 18px; border-radius:6px; font-family:inherit; }

  #setupScreen{ position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:24px; z-index:10; }
  #setupScreen.open{ display:flex; }
  #setupBox{ width:100%; max-width:420px; }
  #setupBox label{ display:block; font-size:11px; letter-spacing:1px; color:var(--text-dim); margin:14px 0 6px; }
  #setupBox input{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--cyan-dim); color:var(--text); padding:12px; border-radius:6px; font-family:inherit; font-size:14px; }
  #saveSetupBtn{ margin-top:20px; width:100%; padding:14px; background:rgba(79,216,255,0.15); border:1px solid var(--cyan); color:var(--cyan); border-radius:6px; font-family:inherit; font-size:13px; letter-spacing:2px; }
  #gearBtn{ position:fixed; top:max(16px, env(safe-area-inset-top)); right:16px; background:transparent; border:1px solid var(--cyan-dim); color:var(--cyan); width:34px; height:34px; border-radius:50%; z-index:5; }
</style>
</head>
<body>
<button id="gearBtn">⚙</button>
<div id="app">
  <h1>J.A.R.V.I.S</h1>
  <div class="sub">CONTROL REMOTO</div>

  <div class="orb-wrap">
    <div class="orb-ring ring1"></div>
    <div class="orb-ring ring2"></div>
    <div class="orb"></div>
  </div>
  <div id="stateLabel">Toca para hablar</div>
  <button id="talkBtn">🎙</button>

  <div class="caption">
    <div class="caption-user" id="captionUser"></div>
    <div class="caption-jarvis" id="captionJarvis">Configura la conexion con el icono de arriba, luego dime "hola JARVIS".</div>
  </div>

  <div class="textbar">
    <input id="textInput" type="text" placeholder="O escribe aqui...">
    <button id="sendBtn">Enviar</button>
  </div>
</div>

<div id="setupScreen">
  <div id="setupBox">
    <h1 style="font-size:16px; letter-spacing:2px;">CONFIGURAR CONEXION</h1>
    <label>URL de tu Cloudflare Worker</label>
    <input id="workerUrlInput" placeholder="https://jarvis-bridge.tu-usuario.workers.dev">
    <label>Secreto (el mismo SHARED_SECRET)</label>
    <input id="workerSecretInput" placeholder="tu-clave-larga">
    <button id="saveSetupBtn">GUARDAR</button>
  </div>
</div>

<script>
const gearBtn = document.getElementById('gearBtn');
const setupScreen = document.getElementById('setupScreen');
const workerUrlInput = document.getElementById('workerUrlInput');
const workerSecretInput = document.getElementById('workerSecretInput');
const saveSetupBtn = document.getElementById('saveSetupBtn');
const talkBtn = document.getElementById('talkBtn');
const stateLabel = document.getElementById('stateLabel');
const captionUser = document.getElementById('captionUser');
const captionJarvis = document.getElementById('captionJarvis');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

function getConfig(){
  return {
    url: localStorage.getItem('jarvis_worker_url') || '',
    secret: localStorage.getItem('jarvis_worker_secret') || ''
  };
}
function saveConfig(url, secret){
  localStorage.setItem('jarvis_worker_url', url);
  localStorage.setItem('jarvis_worker_secret', secret);
}

gearBtn.addEventListener('click', () => {
  const cfg = getConfig();
  workerUrlInput.value = cfg.url;
  workerSecretInput.value = cfg.secret;
  setupScreen.classList.add('open');
});
saveSetupBtn.addEventListener('click', () => {
  saveConfig(workerUrlInput.value.trim(), workerSecretInput.value.trim());
  setupScreen.classList.remove('open');
});

if(!getConfig().url){ setupScreen.classList.add('open'); }

// ---------- TTS (works fine in iOS Safari) ----------
let selectedVoice = null;
function loadVoices(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  selectedVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es')) || voices[0] || null;
}
if(window.speechSynthesis){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(selectedVoice) u.voice = selectedVoice;
  u.lang = selectedVoice ? selectedVoice.lang : 'es-ES';
  u.onstart = () => document.body.classList.add('speaking');
  u.onend = () => document.body.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

function setState(state, label){
  document.body.className = state;
  stateLabel.textContent = label;
}

async function sendToJarvis(kind, payload){
  const cfg = getConfig();
  if(!cfg.url || !cfg.secret){
    captionJarvis.textContent = 'Falta configurar la conexion, toca el icono de arriba.';
    return;
  }
  const id = 'w' + Date.now();
  setState('processing', 'Pensando...');

  try{
    await fetch(cfg.url.replace(/\/$/, '') + '/web-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: cfg.secret, id, kind, ...payload })
    });

    const deadline = Date.now() + 25000;
    while(Date.now() < deadline){
      await new Promise(r => setTimeout(r, 1500));
      const res = await fetch(cfg.url.replace(/\/$/, '') + '/web-status?secret=' + encodeURIComponent(cfg.secret));
      const data = await res.json();
      if(data && data.id === id){
        captionJarvis.textContent = data.text;
        setState('speaking', 'Hablando...');
        speak(data.text);
        setTimeout(() => setState('idle', 'Toca para hablar'), 800);
        return;
      }
    }
    captionJarvis.textContent = 'No hubo respuesta a tiempo, senor. Verifique que su Mac este encendida con JARVIS abierto.';
    setState('idle', 'Toca para hablar');
  }catch(err){
    captionJarvis.textContent = 'Error de conexion: ' + err.message;
    setState('idle', 'Toca para hablar');
  }
}

// ---------- text mode ----------
function sendText(){
  const val = textInput.value.trim();
  if(!val) return;
  captionUser.textContent = 'Tu: ' + val;
  textInput.value = '';
  sendToJarvis('text', { text: val });
}
sendBtn.addEventListener('click', sendText);
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendText(); });

// ---------- voice mode: record audio (works on iOS Safari) and let the Mac transcribe it ----------
let mediaRecorder = null;
let audioChunks = [];
let recording = false;

talkBtn.addEventListener('click', async () => {
  if(recording){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      recording = false;
      talkBtn.classList.remove('active');
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mimeType });
      const base64 = await blobToBase64(blob);
      captionUser.textContent = 'Tu: (nota de voz enviada)';
      sendToJarvis('audio', { audioBase64: base64, mimeType });
    };
    mediaRecorder.start();
    recording = true;
    talkBtn.classList.add('active');
    captionUser.textContent = '';
    setState('listening', 'Escuchando... toca para enviar');
  }catch(err){
    captionJarvis.textContent = 'No tengo permiso de microfono, senor. Autoricelo en Ajustes de Safari/iOS.';
  }
});

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
